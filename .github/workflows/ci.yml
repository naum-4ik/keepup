name: CI

# What runs when (owner, 2026-10-07: PR checks should finish in about a minute):
# - every PR: lint, types, unit tests, Edge Function tests (~50 s);
# - a push to develop or main (a merge): the database tests too, which gate the staging deploy;
# - nightly, on demand, or a PR labelled `full-ci`: the database tests and the full e2e suite.
on:
  # Every PR, including stacked PRs that target another feature branch. `labeled` lets the
  # `full-ci` label start the full run on an open PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]
  schedule:
    - cron: "37 1 * * *" # 01:37 UTC nightly, on develop
  workflow_dispatch:

concurrency:
  # Per event, so the nightly run never cancels a merge's run (the staging deploy waits on that one).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only changes (Markdown and docs/, including the README screenshots) skip the build and test
  # jobs. Skipped jobs count as passed for the required checks, and the staging deploy still sees a
  # green run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Cache node_modules itself (not just npm's download cache): a hit skips `npm ci` (~15 s).
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  functions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-lock: no deno.lock in the repo. --node-modules-dir=none: the root package.json would
      # otherwise make Deno look for npm: packages in node_modules, which this job doesn't install.
      - run: deno test --no-lock --node-modules-dir=none supabase/functions
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/send-push/index.ts
  # Not on ordinary PRs: starting Supabase alone takes ~1.5 min and e2e ~8 min. A skipped job counts
  # as passed for the required checks.
  integration:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull the Supabase images from GitHub's registry: the default (public.ecr.aws) caps anonymous
      # downloads and refused CI with "toomanyrequests: Data limit exceeded".
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase
        run: npx supabase start
      - name: Database tests
        run: npx supabase test db
      - name: Check generated DB types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts
      # E2E runs nightly, on demand, and on PRs labelled `full-ci`; not on a merge's push run, so the
      # staging deploy (which waits on that run) is gated by the DB tests above.
      - if: github.event_name != 'push'
        run: node scripts/local-env.mjs
      - if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: github.event_name != 'push'
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name != 'push'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
