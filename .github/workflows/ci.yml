name: CI

# What runs when (owner, 2026-10-07: PR checks should finish in about a minute; decision 0024):
# - every PR: lint, types, unit tests, Edge Function tests (~50 s, required), and one sanity e2e
#   test (~3 min, not required, so it never holds up a merge), which then scans the build it made
#   for secrets in the client bundle (a few seconds; e2e.yml runs the same scan after each merge);
# - a push to develop or main (a merge): the database tests too, which gate the staging deploy;
#   the full e2e suite runs after each merge in e2e.yml;
# - a PR labelled `full-ci`, or a manual run: the database tests (~2 min). The full e2e suite is not
#   part of any PR check (owner, 2026-10-18: every check within ~2 min); it runs after each merge in
#   e2e.yml, or by hand on a branch: `gh workflow run e2e.yml --ref <branch>`.
on:
  # Every PR, including stacked PRs that target another feature branch. `labeled` lets the
  # `full-ci` label start the full run on an open PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  # Per event, so a manual run never cancels a merge's run (the staging deploy waits on that one).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only changes (Markdown and docs/, including the README screenshots) skip the build and test
  # jobs. Skipped jobs count as passed for the required checks, and the staging deploy still sees a
  # green run. Except docs/privacy-policy.md (the /privacy page is built from it and a unit test
  # guards it: no placeholders left) and docs/install/ (the /install page imports its pictures):
  # an edit there runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qxF docs/privacy-policy.md && ! echo "$files" | grep -q '^docs/install/' && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Cache node_modules itself (not just npm's download cache): a hit skips `npm ci` (~15 s).
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  functions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-lock: no deno.lock in the repo. --node-modules-dir=none: the root package.json would
      # otherwise make Deno look for npm: packages in node_modules, which this job doesn't install.
      - run: deno test --no-lock --node-modules-dir=none --allow-env=NODE_ENV,KEEPUP_LOCALES supabase/functions
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/send-push/index.ts
  # One end-to-end test on every PR, through a real database (e2e/sanity.spec.ts). Not a required
  # check: it reports ~3 min after the PR opens and never blocks the merge. `full-ci` PRs skip it,
  # since the integration job runs the whole suite.
  sanity:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Only what sign-up, Today and check-ins need: no Studio, storage, mail, Edge Functions or logs.
      - name: Start Supabase (core services)
        run: npx supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: node scripts/local-env.mjs
      - run: npx playwright install --with-deps chromium
      - name: Sanity e2e
        run: npx playwright test e2e/sanity.spec.ts
        env:
          CI: "true"
          KEEPUP_LOCALES: en,ru,he
      # Reuses the production build Playwright's webServer just made (a few seconds): the client
      # output must hold only public values (scripts/check-client-secrets.mjs).
      - name: No secrets in the client bundle
        run: node scripts/check-client-secrets.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanity-report
          path: playwright-report
          retention-days: 7

  # Not on ordinary PRs: starting Supabase alone takes ~1.5 min and e2e ~8 min. A skipped job counts
  # as passed for the required checks.
  integration:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull the Supabase images from GitHub's registry: the default (public.ecr.aws) caps anonymous
      # downloads and refused CI with "toomanyrequests: Data limit exceeded".
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only what the database tests and type generation need: Postgres, auth (its schema) and
      # postgres-meta. Starting all 12 services took ~90 s.
      - name: Start Supabase (database only)
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor
      - name: Database tests
        run: npx supabase test db
      - name: Check generated DB types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts
