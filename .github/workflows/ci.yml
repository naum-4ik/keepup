name: CI

on:
  # Every PR, including stacked PRs that target another feature branch.
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only changes (Markdown and docs/, including the README screenshots) skip the build and test
  # jobs. Skipped jobs count as passed for the required checks, and the staging deploy still sees a
  # green run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  functions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-lock: no deno.lock in the repo. --node-modules-dir=none: the root package.json would
      # otherwise make Deno look for npm: packages in node_modules, which this job doesn't install.
      - run: deno test --no-lock --node-modules-dir=none supabase/functions
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/send-push/index.ts
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull the Supabase images from GitHub's registry: the default (public.ecr.aws) caps anonymous
      # downloads and refused CI with "toomanyrequests: Data limit exceeded".
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase
        run: npx supabase start
      - name: Database tests
        run: npx supabase test db
      - name: Check generated DB types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts
      # E2E runs on pull requests only. The push run after a merge tests the same code the PR
      # already passed, and the staging deploy waits on it; DB tests above still gate that deploy.
      - if: github.event_name == 'pull_request'
        run: node scripts/local-env.mjs
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: github.event_name == 'pull_request'
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'pull_request'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
