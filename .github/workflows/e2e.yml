name: E2E after merge

# The full Playwright suite after each merge to develop (decision 0024). It doesn't block anything:
# PRs are already merged and the staging deploy waits on CI's database tests, not on this. A failure
# points to one merge, and GitHub emails the owner.
on:
  push:
    branches: [develop]
    # Docs-only merges skip it, except the docs the app is built from: the /privacy page
    # (docs/privacy-policy.md) and the /install pictures (docs/install/). paths-ignore can't
    # express exceptions, so this is paths with negations; later patterns win.
    paths: ["**", "!**/*.md", "!docs/**", "docs/privacy-policy.md", "docs/install/**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx supabase start
      - run: node scripts/local-env.mjs
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
        env:
          # Canaries for the client-bundle secrets check: fake server-only values the build sees, so
          # a leak of any of them fails the next step. Only on these steps (not `supabase start`); the
          # app never reads them, only the send-push Edge Function uses these names.
          PUSH_WEBHOOK_SECRET: ci-fake-push-webhook-secret-not-real
          SUPABASE_SERVICE_ROLE_KEY: ci-fake-supabase-service-role-key-not-real
          VAPID_PRIVATE_KEY: ci-fake-vapid-private-key-not-real
          CI: "true"
          KEEPUP_LOCALES: en,ru,he
      # The build the suite just ran against hands the browser only public values (a few seconds;
      # PRs run the same scan in CI's sanity job).
      - name: No secrets in the client bundle
        run: node scripts/check-client-secrets.mjs
        env:
          PUSH_WEBHOOK_SECRET: ci-fake-push-webhook-secret-not-real
          SUPABASE_SERVICE_ROLE_KEY: ci-fake-supabase-service-role-key-not-real
          VAPID_PRIVATE_KEY: ci-fake-vapid-private-key-not-real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
