name: Backup staging

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-staging
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Link staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: npx supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      - name: Dump staging (roles, schema, data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dump
          npx supabase db dump --linked --role-only -f dump/roles.sql
          npx supabase db dump --linked -f dump/schema.sql
          npx supabase db dump --linked --data-only --use-copy --schema public -f dump/data.sql
          test -s dump/schema.sql && test -s dump/data.sql
      - name: Encrypt
        env:
          AGE_RECIPIENTS: ${{ secrets.AGE_RECIPIENTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AGE_RECIPIENTS" > recipients.txt
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          tar -czf - -C dump . | age -R recipients.txt -o "staging-$stamp.tar.gz.age"
          echo "FILE=staging-$stamp.tar.gz.age" >> "$GITHUB_ENV"
          rm -rf dump recipients.txt
      - name: Commit to keepup-backups and prune to 30 days
        env:
          BACKUPS_TOKEN: ${{ secrets.BACKUPS_TOKEN }}
        run: |
          set -euo pipefail
          # First run: the repo is empty and has no main branch, so fall back to a fresh init.
          if ! git clone -q --depth 1 --branch main "https://x-access-token:${BACKUPS_TOKEN}@github.com/naum-4ik/keepup-backups.git" backups 2>/dev/null; then
            git init -q -b main backups
            git -C backups remote add origin "https://x-access-token:${BACKUPS_TOKEN}@github.com/naum-4ik/keepup-backups.git"
          fi
          mkdir -p backups/staging
          mv "$FILE" backups/staging/
          cd backups
          # Keep 30 days: file names carry the UTC date.
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for f in staging/staging-*.tar.gz.age; do
            d=$(basename "$f" | sed -E 's/^staging-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
            if [[ "$d" < "$cutoff" ]]; then rm -f "$f"; fi
          done
          # History is rewritten on purpose: every run publishes a single orphan commit, so dumps
          # pruned from the tree are also gone from git history (the 30-day window is real).
          git checkout -q --orphan snapshot
          git add -A
          git -c user.name="keepup-backup" -c user.email="73892942+naum-4ik@users.noreply.github.com" \
            commit -qm "staging backups up to $(date -u +%Y-%m-%d)"
          git push -q --force origin snapshot:main
