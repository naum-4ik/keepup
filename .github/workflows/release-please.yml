name: Release

# Two jobs, two triggers:
# - release-please runs on every push to develop: it keeps the version and changelog PR up to date
#   and tags the release on develop when that PR merges (as before).
# - deploy-production runs on every push to main. main receives only the release PR
#   (develop -> main, HANDBOOK "Release to production"), so one push to main = one production
#   release, and develop pushes never deploy. It isn't gated on release-please's release_created:
#   release-please doesn't run on main, and a "release: vX.Y.Z" squash commit isn't a releasable
#   commit type for it anyway.
# - A manual run (Actions -> Release -> Run workflow) runs deploy-production on the ref picked in
#   the form. db_only applies the migrations and deploys send-push without the Vercel step (the first
#   apply to the empty production project), from develop or main; a full manual deploy from main only.
# Everything production waits for the repo variable PRODUCTION_READY == 'true' (HANDBOOK
# "Production setup"), so this file is safe to merge before production exists.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      db_only:
        description: "Database and send-push only (skip the Vercel deploy)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A push to main that only changes docs (README, docs/) needn't redeploy production: same rule as
  # ci.yml's docs-only skip, including its exceptions for what the app is built from (docs/privacy-policy.md,
  # docs/install/). Manual runs always deploy.
  prod-changes:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "$files"
          # Built into the app: the /privacy page (docs/privacy-policy.md) and the /install pictures (docs/install/).
          if [ -n "$files" ] && ! echo "$files" | grep -qE '^(docs/privacy-policy\.md|docs/install/)' && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Docs-only push to main: production is not redeployed."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Database first: migrations, then the Edge Function, then the app that needs them. A failed step
  # stops the rest, so the app is never newer than its database.
  deploy-production:
    needs: prod-changes
    if: >-
      always() && vars.PRODUCTION_READY == 'true' && (
        (github.event_name == 'push' && github.ref_name == 'main' && needs.prod-changes.outputs.code == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      # Manual runs: db_only from develop (setup, before v1) or main; a full deploy from main only.
      - name: A manual run must come from develop or main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref_name }}
          DB_ONLY: ${{ inputs.db_only }}
        run: |
          if [ "$DB_ONLY" = "true" ]; then
            case "$REF" in
              develop | main) ;;
              *) echo "::error::A db_only run is allowed from develop or main only (this run is on $REF)."; exit 1 ;;
            esac
          elif [ "$REF" != "main" ]; then
            echo "::error::Deploying the app by hand is allowed from main only (this run is on $REF). Use db_only, or run it on main."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Each Supabase call is tried up to 3 times, 10 s apart (scripts/retry.sh), as in the staging
      # deploy: link only writes local config, db push applies only the migrations not yet applied
      # (each in its own transaction), and a function deploy replaces the function.
      - run: scripts/retry.sh npx supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
      # Lists the migrations about to be applied, in the log, before anything changes.
      - run: scripts/retry.sh npx supabase db push --dry-run
      - run: scripts/retry.sh npx supabase db push
      # send-push reads its secrets from Supabase (VAPID keys, webhook secret), never from the repo.
      - run: scripts/retry.sh npx supabase functions deploy send-push --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
      # The keepup-prod Vercel project (serves keepuphabits.vercel.app) (not the staging one: its Production environment is
      # staging). Built on Vercel like the git deploys, so system variables such as
      # VERCEL_PROJECT_PRODUCTION_URL (share-card links) and the Sensitive env values are there.
      # vercel.json's ignoreCommand can't skip it: the upload has no .git, and
      # scripts/vercel-ignore.sh builds whenever it can't diff. GITHUB_SHA gives the app its
      # version suffix (next.config.ts). The CLI isn't a dependency, so it's pinned here.
      - name: Deploy the app to Vercel (keepup-prod)
        id: vercel
        if: ${{ !inputs.db_only }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # --prod on the wrong project would overwrite staging (or anything else): ask Vercel which
          # project VERCEL_PROJECT_ID is, and deploy only if it's keepup-prod in this team.
          name=$(curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.name')
          if [ "$name" != "keepup-prod" ]; then
            echo "::error::VERCEL_PROJECT_ID is project '$name', not keepup-prod. Refusing to deploy to production."
            exit 1
          fi
          # supabase link wrote the project ref and version files here; they don't belong in the upload.
          rm -rf supabase/.temp
          npx --yes vercel@62.7.0 deploy --prod --yes --token "$VERCEL_TOKEN" --build-env GITHUB_SHA="$GITHUB_SHA"
      # The deploy marker on the Grafana dashboards (scripts/change-event.sh, as change-events.yml does for
      # staging, whose deploys Vercel reports itself). It runs after a failed deploy too, and a refused
      # event never fails the release.
      - name: Tell Grafana production was deployed
        if: ${{ always() && !inputs.db_only && steps.vercel.outcome != 'skipped' }}
        continue-on-error: true
        env:
          OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
          OTLP_INSTANCE_ID: ${{ vars.GRAFANA_INSTANCE_ID }}
          OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
          STATE: ${{ steps.vercel.outcome }}
        run: |
          scripts/change-event.sh keepup.deployed deploy.env=production deploy.target=keepup-prod \
            deploy.state="$STATE" deploy.url=https://keepuphabits.vercel.app git.sha="$GITHUB_SHA" actor="$GITHUB_ACTOR"
