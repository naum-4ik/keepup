name: Deploy staging database

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Each Supabase call is tried up to 3 times, 10 s apart (scripts/retry.sh): its management API
      # sometimes fails once (#139's deploy). Safe to repeat: link only writes local config, db push
      # applies only the migrations not yet on the target (each in its own transaction), and a
      # function deploy replaces the function.
      - run: scripts/retry.sh npx supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      # db push is idempotent (it only applies migrations not yet on the target), so running it
      # on every green CI run on develop -- not just ones that touched supabase/migrations -- is
      # safe and keeps this simple.
      - run: scripts/retry.sh npx supabase db push
      # send-push reads its secrets from Supabase (VAPID keys, webhook secret), never from the repo.
      - run: scripts/retry.sh npx supabase functions deploy send-push --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
