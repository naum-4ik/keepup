name: Backup restore test

on:
  schedule:
    - cron: "41 4 3 * *" # 04:41 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age and psql
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: Fetch the latest backup
        env:
          BACKUPS_TOKEN: ${{ secrets.BACKUPS_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${BACKUPS_TOKEN}@github.com/naum-4ik/keepup-backups.git" backups
          latest=$(ls backups/staging/staging-*.tar.gz.age | sort | tail -1)
          echo "Latest: $latest"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
      - name: Decrypt with the CI key
        env:
          AGE_CI_IDENTITY: ${{ secrets.AGE_CI_IDENTITY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AGE_CI_IDENTITY" > ci.key
          mkdir -p dump
          age -d -i ci.key "$LATEST" | tar -xzf - -C dump
          rm ci.key
      - name: Start a throwaway Supabase database
        run: npx supabase db start
      - name: Restore and assert
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f dump/roles.sql || true   # local stack already has the Supabase roles
          psql "$PGURL" -v ON_ERROR_STOP=1 -q \
            -c 'drop schema if exists public cascade; drop schema if exists private cascade; create schema public;'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f dump/schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -c 'set session_replication_role = replica' -f dump/data.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/backup-assert.sql
